services:
  postgres:
    image: postgres:16-alpine
    container_name: gps-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-gps_platform}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    container_name: gps-dashboard
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

  tcp-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.tcp-server
    container_name: gps-tcp-server
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - '4000:4000'
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
